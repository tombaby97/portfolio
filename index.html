:root {

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--white); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
[hidden] { display: none !important; }
.lock { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
.lock main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 22px; background: var(--shade); border: 2px solid var(--shade-line); border-radius: 14px; padding: clamp(28px, 6vw, 56px); }
.lock svg { width: 56px; height: 56px; }
.lock .eyebrow { color: var(--sun); font-size: 12px; font-weight: 800; letter-spacing: 0.5em; text-transform: uppercase; }
.lock h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 7vw, 64px); line-height: 1; }
.lock p { margin: 0; font-weight: 500; }
.lock form { display: flex; flex-direction: column; gap: 8px; }
.lock label { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
.lock .row { display: flex; flex-wrap: wrap; gap: 12px; }
.lock input { flex: 1 1 240px; min-width: 0; min-height: 52px; padding: 0 16px; background: var(--white); border: 0; border-radius: 8px; color: var(--ink); font: 500 15px var(--font-body); }
.lock input:focus-visible, .lock button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.lock button { min-height: 52px; padding: 0 26px; background: var(--sun); color: var(--ink); font: 800 14px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; border: 0; border-radius: 8px; cursor: pointer; }
.lock button:hover { background: var(--white); }
.lock .error { font-size: 14px; font-weight: 600; color: var(--sun); min-height: 1.6em; }
.lock .note { padding-top: 20px; border-top: 2px solid var(--shade-line); font-size: 14px; }
/* Phones: iOS zooms the page when a focused input has text under 16px. */
@media (max-width: 640px) {
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  .lock { padding: 24px 16px; }
  .lock input { font-size: 16px; }
  .lock button { flex: 1 1 auto; }
}

<script>
(function () {
  'use strict';
  // Shared by the build (Node) and the lock page (browser, inlined with the
// `export` keywords stripped). Uses only WebCrypto and browser-safe globals.

const KEY_BYTES = 32;
const IV_BYTES = 12;
const HASH_PREFIX = 'k=';

function bytesToB64url(bytes) {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function b64urlToBytes(text) {
  if (!/^[A-Za-z0-9_-]+$/.test(text)) throw new Error('Not a valid key');
  const b64 = text.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}

// Accepts a full portfolio link, a bare "#k=..." fragment, or the key itself.
function extractKey(input) {
  const text = String(input ?? '').trim();
  if (!text) return null;
  const marker = text.lastIndexOf('#' + HASH_PREFIX);
  const candidate = marker >= 0
    ? text.slice(marker + 1 + HASH_PREFIX.length)
    : text.replace(/^#/, '').replace(new RegExp('^' + HASH_PREFIX), '');
  return /^[A-Za-z0-9_-]{43}$/.test(candidate) ? candidate : null;
}

async function importKey(keyText, usage) {
  const raw = b64urlToBytes(keyText);
  if (raw.length !== KEY_BYTES) throw new Error('Key has the wrong length');
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, [usage]);
}

// Returns base64url( iv || ciphertext || tag ).
async function encryptPayload(plainText, keyText) {
  const key = await importKey(keyText, 'encrypt');
  const iv = crypto.getRandomValues(new Uint8Array(IV_BYTES));
  const data = new TextEncoder().encode(plainText);
  const sealed = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
  const out = new Uint8Array(iv.length + sealed.length);
  out.set(iv, 0);
  out.set(sealed, iv.length);
  return bytesToB64url(out);
}

// Throws when the key is wrong or the payload was tampered with.
async function decryptPayload(payloadText, keyText) {
  const key = await importKey(keyText, 'decrypt');
  const bytes = b64urlToBytes(payloadText);
  if (bytes.length <= IV_BYTES) throw new Error('Payload is too short');
  const iv = bytes.slice(0, IV_BYTES);
  const sealed = bytes.slice(IV_BYTES);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, sealed);
  return new TextDecoder().decode(plain);
}

function generateKey() {
  return bytesToB64url(crypto.getRandomValues(new Uint8Array(KEY_BYTES)));
}


  var lock = document.getElementById('lock');
  var app = document.getElementById('app');
  var form = document.getElementById('unlock-form');
  var input = document.getElementById('unlock-input');
  var errorBox = document.getElementById('unlock-error');
  var payload = document.getElementById('payload').textContent.trim();
  var unlocked = false;

  var MESSAGES = {
    empty: 'Paste the portfolio link from the resume first.',
    malformed: "That doesn't look like the portfolio link. Copy the whole link from the resume, including everything after the # sign.",
    wrongKey: "That link didn't unlock the page. Check that it was copied in full, or ask Tom for an up-to-date resume.",
    unsupported: 'This browser cannot decrypt the page. Open the link in a current version of Chrome, Firefox, Safari or Edge.',
  };

  function showLock(message) {
    app.hidden = true;
    lock.hidden = false;
    errorBox.textContent = message || '';
  }

  function render(bundle) {
    var style = document.createElement('style');
    style.textContent = bundle.css;
    document.head.appendChild(style);
    app.innerHTML = bundle.html;
    lock.hidden = true;
    app.hidden = false;
    document.title = bundle.title;
    var script = document.createElement('script');
    script.textContent = bundle.js;
    document.body.appendChild(script);
    unlocked = true;
  }

  async function unlock(rawInput) {
    if (unlocked) return;
    if (!window.crypto || !window.crypto.subtle) return showLock(MESSAGES.unsupported);
    var key = extractKey(rawInput);
    if (!key) return showLock(String(rawInput || '').trim() ? MESSAGES.malformed : MESSAGES.empty);
    var bundle;
    try {
      bundle = JSON.parse(await decryptPayload(payload, key));
    } catch (err) {
      console.warn('Portfolio unlock failed:', err && err.name ? err.name : err);
      return showLock(MESSAGES.wrongKey);
    }
    render(bundle);
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    unlock(input.value);
  });
  window.addEventListener('hashchange', function () { unlock(location.hash); });

  if (location.hash.length > 1) unlock(location.hash);
  else showLock('');
})();
</script>
